
services:
  postgres:
    image: postgres:17
    container_name: agenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub
      POSTGRES_DB: agenthub
    ports:
      - "5432:5432"
    volumes:
      - agenthub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U agenthub -d agenthub",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agenthub_postgres_data: